replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: artifacts.iflytek.com/cbg-docker-repo/cbbywkf/app
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: app.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  PORT: "3000"
  NODE_ENV: production

envFrom: []
secretName: ""

health:
  livenessPath: /health
  readinessPath: /health

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

serviceAccount:
  create: true
  annotations: {}
  name: ""

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
