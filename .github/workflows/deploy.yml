name: Validate RDHS pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit --incremental false
      - name: Lint
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build:pages
        env:
          RDHS_BASE_PATH: /meegle-rdhs-report
