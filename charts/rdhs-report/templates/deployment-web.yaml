{{- include "rdhs-report.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rdhs-report.webName" . }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "rdhs-report.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "rdhs-report.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "rdhs-report.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "rdhs-report.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: DEPLOY_TARGET
              value: k8s
            - name: RDHS_STORAGE
              value: mysql
            - name: MYSQL_HOST
              value: {{ .Values.database.mysql.host | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.database.mysql.port | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.database.mysql.database | quote }}
            - name: MYSQL_CONNECTION_LIMIT
              value: {{ .Values.database.mysql.connectionLimit | quote }}
            - name: MYSQL_TLS
              value: {{ .Values.database.mysql.tls | quote }}
            - name: MYSQL_TLS_REJECT_UNAUTHORIZED
              value: {{ .Values.database.mysql.tlsRejectUnauthorized | quote }}
            - name: RDHS_ALLOW_DEMO_FALLBACK
              value: "false"
            - name: RDHS_REFRESH_WEBHOOK_URL
              value: {{ printf "http://%s:8765/rdhs/refresh" (include "rdhs-report.runnerName" .) | quote }}
          envFrom:
            - secretRef:
                name: {{ required "secrets.web.name is required" .Values.secrets.web.name }}
            - secretRef:
                name: {{ required "database.mysql.secretName is required" .Values.database.mysql.secretName }}
          livenessProbe:
            httpGet:
              path: {{ printf "%s/api/health/live" .Values.ingress.pathPrefix | quote }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ printf "%s/api/health" .Values.ingress.pathPrefix | quote }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
