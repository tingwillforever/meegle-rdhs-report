{{- include "rdhs-report.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rdhs-report.webName" . }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rdhs-report.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "rdhs-report.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "rdhs-report.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "rdhs-report.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: DEPLOY_TARGET
              value: k8s
            - name: RDHS_STORAGE
              value: sqlite
            - name: RDHS_DB_PATH
              value: {{ printf "%s/rdhs.sqlite" .Values.persistence.mountPath | quote }}
            - name: RDHS_ALLOW_DEMO_FALLBACK
              value: "false"
            - name: RDHS_REFRESH_WEBHOOK_URL
              value: {{ printf "http://%s:8765/rdhs/refresh" (include "rdhs-report.runnerName" .) | quote }}
          envFrom:
            - secretRef:
                name: {{ required "secrets.web.name is required" .Values.secrets.web.name }}
          volumeMounts:
            - name: sqlite
              mountPath: {{ .Values.persistence.mountPath }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: {{ include "rdhs-report.sqliteClaimName" . }}
