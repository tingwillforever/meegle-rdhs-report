{{- include "rdhs-report.validate" . }}
{{- if .Values.ingress.enabled }}
{{- $pathPrefix := required "ingress.pathPrefix is required" .Values.ingress.pathPrefix }}
{{- $baseIngressAnnotations := dict "nginx.ingress.kubernetes.io/use-regex" "true" }}
{{- $ingressAnnotations := merge $baseIngressAnnotations (.Values.ingress.annotations | default dict) }}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey $ingressAnnotations "kubernetes.io/ingress.class") }}
  {{- $_ := set $ingressAnnotations "kubernetes.io/ingress.class" .Values.ingress.className }}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1beta1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "rdhs-report.webName" . }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with $ingressAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ printf "%s(/|$)(.*)" $pathPrefix }}
            {{- if semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion }}
            pathType: ImplementationSpecific
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ include "rdhs-report.webName" . }}
                port:
                  name: http
              {{- else }}
              serviceName: {{ include "rdhs-report.webName" . }}
              servicePort: http
              {{- end }}
{{- end }}
