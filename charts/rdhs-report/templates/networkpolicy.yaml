{{- if .Values.networkPolicy.enabled }}
{{- include "rdhs-report.validate" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rdhs-report.webName" . }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rdhs-report.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "rdhs-report.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: runner
        - podSelector:
            matchLabels:
              {{- include "rdhs-report.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: sync
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "rdhs-report.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: runner
      ports:
        - protocol: TCP
          port: 8765
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
