{{- include "rdhs-report.validate" . }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.web.name }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
type: Opaque
stringData:
  RDHS_INGEST_TOKEN: {{ .Values.secrets.web.data.RDHS_INGEST_TOKEN | quote }}
  RDHS_REFRESH_WEBHOOK_TOKEN: {{ .Values.secrets.web.data.RDHS_REFRESH_WEBHOOK_TOKEN | quote }}
{{- end }}
{{- if .Values.database.mysql.credentials.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "database.mysql.secretName is required" .Values.database.mysql.secretName }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_USER: {{ .Values.database.mysql.credentials.user | quote }}
  MYSQL_PASSWORD: {{ .Values.database.mysql.credentials.password | quote }}
{{- end }}
