apiVersion: v1
kind: Service
metadata:
  name: {{ include "rdhs-report.runnerName" . }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  type: ClusterIP
  selector:
    {{- include "rdhs-report.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
