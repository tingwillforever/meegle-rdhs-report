apiVersion: v1
kind: Service
metadata:
  name: {{ include "rdhs-report.webName" . }}
  labels:
    {{- include "rdhs-report.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "rdhs-report.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
