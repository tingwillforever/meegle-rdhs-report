# Production smoke-test overlay. Credentials are intentionally inline for the
# first deployment validation; move them to a managed Secret and rotate the
# password after verification.
image:
  repository: artifacts.iflytek.com/cbg-docker-repo/cbbywkf/meegle-rdhs-report
  tag: "4.0.4"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: hub4iflytek

database:
  driver: mysql
  mysql:
    host: 172.31.114.194
    port: 4302
    database: rdhs_report
    secretName: rdhs-report-db-secrets
    credentials:
      create: true
      user: root
      password: "htzhang16_M2099"
    connectionLimit: 10
    tls: false
    tlsRejectUnauthorized: true

secrets:
  create: false
  web:
    name: rdhs-report-web-secrets

ingress:
  className: nginx
  host: ossptest.voicecloud.cn
  pathPrefix: /meegle-rdhs-report
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  # Access control is provided by the existing internal gateway.

# Keep NetworkPolicy disabled until the cluster and Meegle egress selectors
# are supplied and validated by the network team.
networkPolicy:
  enabled: false
  mysqlEgress:
    - ipBlock:
        cidr: 172.31.114.194/32
