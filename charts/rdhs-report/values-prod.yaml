# Production configuration. This file is intentionally complete because the
# build-chart.sh release contract replaces values.yaml with values-prod.yaml.
fullnameOverride: ""

imagePullSecrets:
  - name: hub4iflytek

image:
  repository: artifacts.iflytek.com/cbg-docker-repo/cbbywkf/meegle-rdhs-report
  tag: "4.0.4"
  pullPolicy: IfNotPresent

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

sync:
  # This is injected directly into the Web and CronJob containers. Keep it
  # long and random; do not reuse the database password.
  ingestToken: "90f5e9f3d76e593285f89ee2e8c6a9bf94943bfa848e5310dcb30d6c7921ad15"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  currentRefreshTimeoutSeconds: 600
  reportCommandTimeoutSeconds: 540
  leaseTtlSeconds: 1800
  outputRetentionMonths: 6
  cron:
    schedule: "0 9 1 * *"
    timeZone: Asia/Shanghai
    suspend: false
    activeDeadlineSeconds: 1500
    backoffLimit: 2
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    ttlSecondsAfterFinished: 604800

syncOutput:
  mountPath: /var/lib/rdhs-sync

database:
  driver: mysql
  mysql:
    host: 172.31.114.194
    port: 4302
    database: rdhs_report
    secretName: rdhs-report-db-secrets
    credentials:
      create: true
      user: root
      password: "htzhang16_M2099"
    connectionLimit: 10
    tls: false
    tlsRejectUnauthorized: true

report:
  workspaceRoot: /opt/rdhs-workspace
  monthlyBaselineCommand: >-
    python3 /opt/rdhs-workspace/topics/rdhs-operations/run_periodic_report.py
    --mode monthly-baseline
  monthlyCommand: >-
    python3 /opt/rdhs-workspace/topics/rdhs-operations/run_periodic_report.py
    --mode weekly
  currentCommand: >-
    python3 /opt/rdhs-workspace/topics/rdhs-operations/run_periodic_report.py
    --mode weekly

serviceAccount:
  create: true
  name: ""
  annotations: {}

ingress:
  enabled: true
  className: nginx
  host: ossptest.voicecloud.cn
  pathPrefix: /meegle-rdhs-report
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  tls: []
  # Access control is provided by the existing internal gateway.

pdb:
  enabled: false
  minAvailable: 1

# Keep NetworkPolicy disabled until the cluster and Meegle egress selectors
# are supplied and validated by the network team.
networkPolicy:
  enabled: false
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  meegleEgress: []
  mysqlEgress:
    - ipBlock:
        cidr: 172.31.114.194/32
